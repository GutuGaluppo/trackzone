name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build web app
        run: pnpm turbo run build --filter=@trackzone/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          R2_ACCOUNT_ID: placeholder-account-id
          R2_ACCESS_KEY_ID: placeholder-access-key-id
          R2_SECRET_ACCESS_KEY: placeholder-secret-access-key
          R2_BUCKET: trackzone-audio
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  db:
    name: RLS integration tests against a real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies every migration in supabase/migrations)
        run: supabase start

      - name: Export local instance credentials
        id: supabase
        run: |
          json=$(supabase status -o json)
          echo "url=$(echo "$json" | jq -r .API_URL)" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(echo "$json" | jq -r .ANON_KEY)" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$(echo "$json" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RLS/schema integration tests
        run: pnpm --filter @trackzone/database test:integration
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
